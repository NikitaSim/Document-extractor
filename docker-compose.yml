services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      HTTP_TIMEOUT: "2m"
      MAX_FILE_SIZE: "20971520"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen3:8b"
      OLLAMA_TIMEOUT: "2m"
    depends_on:
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
